name: N0TE2 Builder Handoff Qualification

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited, labeled, unlabeled]
  workflow_run:
    workflows: ["N0TE2 Governance"]
    types: [completed]

concurrency:
  group: n0te2-builder-handoff-${{ github.event.pull_request.number || github.event.workflow_run.id }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  protect-enforcement-surfaces:
    if: ${{ github.event_name == 'pull_request_target' }}
    name: builder-handoff-trust-boundary
    runs-on: ubuntu-latest
    env:
      N0TE2_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      N0TE2_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      N0TE2_META_GOVERNANCE_REOPEN: ${{ contains(github.event.pull_request.labels.*.name, 'steward-meta-governance-reopen') && 'MAIN_STEWARD_LABEL' || '' }}
      EVIDENCE_CONTEXT: n0te2-builder-handoff-trust
    steps:
      - name: Reset trust-boundary status to pending
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS_STATE: pending
          STATUS_DESCRIPTION: Builder handoff trust-boundary evaluation in progress
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$N0TE2_HEAD_SHA" \
            -d "{\"state\":\"$STATUS_STATE\",\"context\":\"$EVIDENCE_CONTEXT\",\"description\":\"$STATUS_DESCRIPTION\"}"

      - name: Checkout exact candidate without executing it
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fetch exact trusted base
        env:
          BASE_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: git fetch --no-tags "https://github.com/${BASE_REPOSITORY}.git" "$N0TE2_BASE_SHA"

      - name: Protect Builder handoff enforcement surfaces
        shell: bash
        run: |
          CHANGED="$(git diff --no-renames --name-only "$N0TE2_BASE_SHA...$N0TE2_HEAD_SHA")"
          PROTECTED="$(
            printf '%s\n' "$CHANGED" | grep -Fx \
              -e .github/workflows/builder-handoff-qualification.yml \
              -e governance/builder_handoff.py \
              -e governance/builder_handoff_contract.json \
              -e governance/check_builder_handoff_intake.py || true
          )"
          if [ -n "$PROTECTED" ] && [ "$N0TE2_META_GOVERNANCE_REOPEN" != "MAIN_STEWARD_LABEL" ]; then
            echo "Builder handoff trusted enforcement changed without explicit Main Steward meta-governance reopen:" >&2
            printf '%s\n' "$PROTECTED" >&2
            exit 1
          fi

      - name: Publish trust-boundary success
        if: ${{ success() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS_STATE: success
          STATUS_DESCRIPTION: Builder handoff trust boundary passed; not merge authorization
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$N0TE2_HEAD_SHA" \
            -d "{\"state\":\"$STATUS_STATE\",\"context\":\"$EVIDENCE_CONTEXT\",\"description\":\"$STATUS_DESCRIPTION\"}"

      - name: Publish trust-boundary failure
        if: ${{ failure() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS_STATE: failure
          STATUS_DESCRIPTION: Builder handoff trust boundary failed; merge blocked
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$N0TE2_HEAD_SHA" \
            -d "{\"state\":\"$STATUS_STATE\",\"context\":\"$EVIDENCE_CONTEXT\",\"description\":\"$STATUS_DESCRIPTION\"}"

  qualify-builder-handoff:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.pull_requests[0].number }}
    name: trusted-builder-handoff
    runs-on: ubuntu-latest
    env:
      N0TE2_BASE_SHA: ${{ github.event.workflow_run.pull_requests[0].base.sha }}
      N0TE2_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      N0TE2_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
      N0TE2_BASE_BRANCH: ${{ github.event.workflow_run.pull_requests[0].base.ref }}
      N0TE2_CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      N0TE2_CI_RUN_ID: ${{ github.event.workflow_run.id }}
      N0TE2_CI_RUN_URL: ${{ github.event.workflow_run.html_url }}
      N0TE2_CI_COMPLETED_AT: ${{ github.event.workflow_run.updated_at }}
      TRUSTED_PATH: .builder-handoff-trusted-${{ github.run_id }}-${{ github.run_attempt }}
      EVIDENCE_CONTEXT: n0te2-builder-handoff
    steps:
      - name: Reset Builder handoff status to pending
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS_STATE: pending
          STATUS_DESCRIPTION: Trusted exact-head Builder handoff qualification in progress
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$N0TE2_HEAD_SHA" \
            -d "{\"state\":\"$STATUS_STATE\",\"context\":\"$EVIDENCE_CONTEXT\",\"description\":\"$STATUS_DESCRIPTION\"}"

      - name: Set up trusted Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Checkout exact candidate without executing it
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.event.workflow_run.head_repository.full_name }}
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Fetch exact trusted base with merge-base ancestry
        env:
          BASE_REPOSITORY: ${{ github.event.workflow_run.pull_requests[0].base.repo.full_name }}
        shell: bash
        run: git fetch --no-tags "https://github.com/${BASE_REPOSITORY}.git" "$N0TE2_BASE_SHA"

      - name: Checkout trusted base enforcement copy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.event.workflow_run.pull_requests[0].base.repo.full_name }}
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ env.N0TE2_BASE_SHA }}
          path: ${{ env.TRUSTED_PATH }}

      - name: Verify trusted Builder handoff enforcement exists
        shell: bash
        run: |
          test -f "$TRUSTED_PATH/governance/builder_handoff.py"
          test -f "$TRUSTED_PATH/governance/builder_handoff_contract.json"
          test -f "$TRUSTED_PATH/governance/check_builder_handoff_intake.py"

      - name: Qualify exact-head Builder handoff using trusted base code
        shell: bash
        run: |
          python "$TRUSTED_PATH/governance/check_builder_handoff_intake.py" \
            --repo . \
            --output builder-handoff-runtime.json

      - name: Upload exact-head Builder handoff receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: n0te2-builder-handoff-${{ env.N0TE2_HEAD_SHA }}
          path: builder-handoff-runtime.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Publish Builder handoff success
        if: ${{ success() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS_STATE: success
          STATUS_DESCRIPTION: Trusted exact-head Builder handoff qualified; not merge authorization
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$N0TE2_HEAD_SHA" \
            -d "{\"state\":\"$STATUS_STATE\",\"context\":\"$EVIDENCE_CONTEXT\",\"description\":\"$STATUS_DESCRIPTION\"}"

      - name: Publish Builder handoff failure
        if: ${{ failure() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS_STATE: failure
          STATUS_DESCRIPTION: Trusted exact-head Builder handoff failed; merge blocked
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$N0TE2_HEAD_SHA" \
            -d "{\"state\":\"$STATUS_STATE\",\"context\":\"$EVIDENCE_CONTEXT\",\"description\":\"$STATUS_DESCRIPTION\"}"
