name: N0TE2 Governance

on:
  push:
  pull_request:

concurrency:
  group: n0te2-governance-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  governance:
    name: governance-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      N0TE2_RUN_ID: ${{ github.run_id }}
      N0TE2_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install repository dependencies and test runner
        run: python -m pip install --disable-pip-version-check -r requirements.txt "pytest>=8.4,<9"
      - name: Verify exact event head checkout
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          python -c "import os, subprocess; actual=subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(); expected=os.environ['EXPECTED_SHA']; print(f'expected={expected} actual={actual}'); assert actual == expected, f'checkout mismatch: expected {expected}, got {actual}'"
      - name: Validate construction governance
        run: python governance/check_governance.py --repo .
      - name: Validate context lifecycle governance
        run: python governance/check_context_lifecycle.py --repo .
      - name: Inspect supervision graph
        run: python governance/supervision.py --repo .
      - name: Build exact-head runtime handoff
        env:
          N0TE2_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: python governance/build_handoff.py --repo . --check --output governance-runtime-handoff.json
      - name: Governance and product regression tests
        run: python -m pytest -q tests
      - name: Stage consumer smoke
        run: python governance/smoke/consumer_smoke.py
      - name: Record supervision observation
        if: ${{ always() }}
        env:
          N0TE2_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          N0TE2_OBSERVATION_STATUS: ${{ job.status }}
          N0TE2_RUNNER_OS: ${{ runner.os }}
        run: python governance/build_handoff.py --repo . --output governance-runtime-handoff.json --observation-output governance-ci-observation.json
      - name: Upload supervision evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: n0te2-supervision-${{ runner.os }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: |
            governance-runtime-handoff.json
            governance-ci-observation.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish exact-head success evidence
        if: ${{ success() }}
        env:
          EVIDENCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          EVIDENCE_CONTEXT: n0te2-governance-${{ runner.os }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.EVIDENCE_SHA,
              state: 'success',
              context: process.env.EVIDENCE_CONTEXT,
              description: 'Exact raw-head governance passed'
            })
      - name: Publish exact-head failure evidence
        if: ${{ failure() }}
        env:
          EVIDENCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          EVIDENCE_CONTEXT: n0te2-governance-${{ runner.os }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.EVIDENCE_SHA,
              state: 'failure',
              context: process.env.EVIDENCE_CONTEXT,
              description: 'Exact raw-head governance failed'
            })
