name: N0TE2 Governance

on:
  push:
  pull_request:

permissions:
  contents: read
  statuses: write

jobs:
  governance:
    name: governance-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      EVIDENCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact event head checkout
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          python -c "import os, subprocess; actual=subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(); expected=os.environ['EXPECTED_SHA']; print(f'expected={expected} actual={actual}'); assert actual == expected, f'checkout mismatch: expected {expected}, got {actual}'"
      - name: Validate construction governance
        run: python governance/check_governance.py --repo .
      - name: Governance and product regression tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Stage consumer smoke
        run: python governance/smoke/consumer_smoke.py
      - name: Publish exact-head success evidence
        if: ${{ success() }}
        env:
          EVIDENCE_CONTEXT: n0te2-governance-${{ runner.os }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.EVIDENCE_SHA,
              state: 'success',
              context: process.env.EVIDENCE_CONTEXT,
              description: 'Exact raw-head governance passed'
            })
      - name: Publish exact-head failure evidence
        if: ${{ failure() }}
        env:
          EVIDENCE_CONTEXT: n0te2-governance-${{ runner.os }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.EVIDENCE_SHA,
              state: 'failure',
              context: process.env.EVIDENCE_CONTEXT,
              description: 'Exact raw-head governance failed'
            })
